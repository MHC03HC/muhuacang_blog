<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面走丢了 - 阿木木的技术笔记</title>
  <meta name="description" content="你访问的页面不存在，可能是链接错误或文章已移动。">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --panel: rgba(255,255,255,.88);
      --border: rgba(148,163,184,.22);
      --text: #16213f;
      --muted: #5e7094;
      --primary: #2f6df6;
      --primary-strong: #2156cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09111f;
        --panel: rgba(12, 20, 37, .92);
        --border: rgba(96, 118, 160, .28);
        --text: #edf3ff;
        --muted: #a8b5d0;
        --primary: #7ba2ff;
        --primary-strong: #a9c1ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top right, rgba(83, 126, 255, .16), transparent 28%),
        radial-gradient(circle at bottom left, rgba(126, 211, 255, .14), transparent 26%),
        var(--bg);
      color: var(--text);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(100%, 760px);
      border-radius: 28px;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(15, 23, 42, .12);
      padding: clamp(28px, 5vw, 44px);
    }
    .kicker {
      margin: 0 0 12px;
      color: #f97f7f;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.05;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(16px, 2.4vw, 20px);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform .18s ease, background-color .18s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      color: #fff;
      background: var(--primary);
    }
    .btn-primary:hover { background: var(--primary-strong); }
    .btn-secondary {
      color: var(--text);
      background: rgba(148, 163, 184, .12);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="kicker">404</p>
    <h1>页面走丢了</h1>
    <p>你访问的页面不存在，可能是链接错误或文章已移动。</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">返回首页</a>
      <a class="btn btn-secondary" href="/blog">返回文章列表</a>
    </div>
  </main>
</body>
</html>
