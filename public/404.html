<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>页面走丢了 - 阿木木的技术博客</title>
  <meta name="description" content="你访问的页面不存在，可能是链接错误或内容已移动。">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    (function () {
      var stored;
      try { stored = localStorage.getItem('amumu-theme'); } catch (e) {}
      var media = matchMedia('(prefers-color-scheme: dark)');
      function apply() {
        document.documentElement.dataset.theme = stored === 'light' || stored === 'dark'
          ? stored : (media.matches ? 'dark' : 'light');
      }
      apply();
      media.addEventListener('change', apply);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f1e8;
      --panel: #faf8f0;
      --soft: #e7ebe1;
      --line: #daddd1;
      --text: #2d3732;
      --muted: #59655d;
      --accent: #496b57;
      --contrast: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg: #0b1120;
        --panel: #101828;
        --soft: #162033;
        --line: #243247;
        --text: #e5eefb;
        --muted: #9fb0c8;
        --accent: #60a5fa;
        --contrast: #08101d;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1120;
      --panel: #101828;
      --soft: #162033;
      --line: #243247;
      --text: #e5eefb;
      --muted: #9fb0c8;
      --accent: #60a5fa;
      --contrast: #08101d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem clamp(1rem, 4vw, 2rem);
      background: var(--bg);
      color: var(--text);
      font: 1rem/1.7 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .shell { width: min(100%, 75rem); margin-inline: auto; }
    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding-block: 0 1rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.95rem;
      font-weight: 700;
    }
    header span {
      display: grid;
      place-items: center;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.5rem;
      background: var(--accent);
      color: var(--contrast);
    }
    .card {
      width: min(100%, 48rem);
      margin-block: clamp(3rem, 10vw, 8rem);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid var(--line);
      border-radius: 0.875rem;
      background: var(--panel);
    }
    .kicker {
      margin: 0 0 0.8rem;
      color: var(--accent);
      font: 700 clamp(1.5rem, 3vw, 2rem)/1.2 ui-monospace, monospace;
    }
    h1 { margin: 0; font-size: clamp(2.125rem, 5vw, 3.375rem); line-height: 1.14; }
    p { margin: 1rem 0 0; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      padding: 0 1rem;
      border: 1px solid var(--accent);
      border-radius: 0.5rem;
      background: var(--soft);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }
    .btn-primary { background: var(--accent); color: var(--contrast); }
    .btn:hover { text-decoration: underline; text-underline-offset: 0.2em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="shell">
    <header><span aria-hidden="true">穆</span>阿木木的技术博客</header>
    <main class="card">
      <p class="kicker">404</p>
      <h1>页面走丢了</h1>
      <p>你访问的页面不存在，可能是链接错误或内容已移动。</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">返回首页</a>
        <a class="btn" href="/blog">返回文章列表</a>
        <a class="btn" href="/wiki">浏览 Wiki</a>
      </div>
    </main>
  </div>
</body>
</html>
